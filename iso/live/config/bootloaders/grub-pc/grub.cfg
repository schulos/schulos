source /boot/grub/config.cfg

# INST-05: Ist auf einer Platte ein SchulOS fertig installiert, steht „Von der Festplatte starten“ vorn und ist die Vorgabe –
# falls die Firmware die Startreihenfolge des Installers nicht übernommen hat (oder das Medium noch eingelegt ist), landet ein
# Neustart so nicht wieder im Installer. Neu installieren: „SchulOS installieren“ wählen.
# GATE-4f C-03: Erkannt wird nicht die Bezeichnung „schulos-boot“ (die gibt es schon mitten in einer abgebrochenen Installation),
# sondern die Markierung /grub/schulos-installiert, die der Installer erst als letzten Schritt schreibt. Liegt ein
# Antworten-Laufwerk SCHULOSCFG bei oder steht schulos.unbeaufsichtigt in der Kernel-Zeile, ist eine (Neu-)Installation gewollt:
# dann bleibt der Installer die Vorgabe, die Platte startet nie von selbst.
# GATE-4f C-04: /boot liegt beim Spiegel auf mdadm-RAID 1 (Metadaten 1.2) – ohne mdraid1x sieht GRUB das Dateisystem nicht.
insmod part_gpt
insmod ext2
insmod mdraid1x
insmod mdraid09
insmod fat
insmod iso9660
insmod regexp
search --no-floppy --file /grub/schulos-installiert --set=schulos_boot
search --no-floppy --label SCHULOSCFG --set=schulos_antworten
set schulos_kernel="@APPEND_LIVE@"
if regexp 'schulos\.unbeaufsichtigt' "${schulos_kernel}"; then
	set schulos_antworten=kernel
fi
if [ -n "${schulos_boot}" ]; then
	menuentry "Von der Festplatte starten (SchulOS ist installiert)" --id schulos-platte --hotkey=f {
		set root="${schulos_boot}"
		configfile /grub/grub.cfg
	}
fi

# SchulOS-Installer (live-build ersetzt die @…@-Platzhalter beim Bau)
menuentry "SchulOS installieren" --id schulos-installieren --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Startmedium prüfen (Prüfsummen)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI-Einstellungen" --hotkey=u {
		fwsetup
	}
fi

# Vorgabe: Platte nur, wenn fertig installiert und keine (unbeaufsichtigte) Installation gewollt ist
set default=schulos-installieren
if [ -n "${schulos_boot}" ]; then
	if [ -z "${schulos_antworten}" ]; then
		set default=schulos-platte
	fi
fi
