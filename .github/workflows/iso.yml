# B-44/B-45: SchulOS-ISO bauen (live-build im privilegierten Debian-13-Container, Offline-Paketquelle, Images als tar), Rauchtest
# und QEMU-Tests nach INSTALLATION.md §7 (Backupserver + Hauptsystem aus der ISO, Kopplung, Sicherung, Test-Restore, Wiederherstellung).
# Teuer → nur von Hand bzw. vor Releases (B-13).
# Läuft wahlweise auf der Build-VM (self-hosted Runner „schulos-iso“, Vorgabe: Docker- und Paket-Caches bleiben
# erhalten, mehr RAM/Platte, keine GitHub-Minuten; die ISO bleibt dort unter ~/schulos-iso liegen) oder auf einem GitHub-Runner
# (ISO als Artefakt, 2 Tage). Ergebnis und Protokoll stehen in beiden Fällen hier in GitHub.
# Schneller bei Änderungen nur an den Tests: `iso_aus_lauf` = „letzte“ (Build-VM) bzw. Lauf-ID (GitHub) → ISO ohne Neubau.
# Release-ISO (B-49): `release` = Tag eines GitHub-Releases → Stand des Release-Commits, Images aus GHCR wie im signierten
# Manifest (cosign geprüft), danach dieselben Tests; ISO, Prüfsumme, cosign-Signatur der Prüfsumme und Stückliste kommen als
# Anhang ans Release (REPO-02). Signiert wird im Job „release-anhang“: mit SCHULOS_RUNNER=oeffentlich/github bzw. runner=github
# auf einem GitHub-Runner (ISO dann als Artefakt, 1 Tag), sonst auf der Build-VM wie release.yml.
name: ISO

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "wo bauen und testen"
        type: choice
        options: [build-vm, github]
        default: build-vm
      version:
        description: "Version im Dateinamen und in den Images (Vorgabe: dev-<commit>; bei `release` die des Releases)"
        type: string
        required: false
      release:
        description: "Release-ISO aus den signierten Images dieses Releases (Tag, z. B. v0.2.0) statt Neubau aus dem Stand"
        type: string
        required: false
      ohne_qemu:
        description: "nur bauen + Rauchtest, ohne die QEMU-Tests"
        type: boolean
        default: false
      qemu:
        description: "welche QEMU-Tests: §7 aus der ISO, qcow2-Abbilder (B-46) oder beide"
        type: choice
        options: [iso, qcow2, beide]
        default: iso
      iso_aus_lauf:
        description: "ISO wiederverwenden statt neu bauen: „letzte“ (Build-VM) bzw. Lauf-ID (github) – nur wenn sich Installer/ISO nicht geändert haben"
        type: string
        required: false
      reproduzierbar:
        description: "statt der Tests: denselben Commit zweimal bauen und vergleichen (B-47, iso/repro.sh, ~1,5 h)"
        type: boolean
        default: false

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  # Release-ISO: Images aus GHCR (private Pakete)
  packages: read

env:
  LOKAL: ${{ inputs.runner != 'github' }}
  # REPO-02: Release-Anhang auf einem GitHub-Runner (Schlüssel nicht auf der Build-VM) – dieselbe Bedingung wie runs-on unten
  ANHANG_GITHUB: ${{ inputs.runner == 'github' || vars.SCHULOS_RUNNER == 'oeffentlich' || vars.SCHULOS_RUNNER == 'github' }}
  ISO_LAGER: /home/runner/schulos-iso

jobs:
  # B-47: zwei Builds desselben Commits vergleichen; Ergebnis (bitgleich bzw. diffoscope-Bericht) als Artefakt
  repro:
    if: ${{ inputs.reproduzierbar }}
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-24.04' || fromJSON('["self-hosted","schulos-iso"]') }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/platz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Platz schaffen (GitHub-Runner)
        if: ${{ env.LOKAL != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Zweimal bauen und vergleichen
        run: bash iso/repro.sh --out iso/out-repro 2>&1 | tee iso/out-repro.log; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: reproduzierbarkeit
          path: |
            iso/out-repro.log
            iso/out-repro/diffoscope.txt
            iso/out-repro/*/*.sha256
            iso/out-repro/*/*.stueckliste.json
          retention-days: 14
          if-no-files-found: warn

  iso:
    if: ${{ !inputs.reproduzierbar }}
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-24.04' || fromJSON('["self-hosted","schulos-iso"]') }}
    timeout-minutes: 180
    steps:
      # B-49: Commit des Releases aus dem Manifest (geprüft wird die Signatur beim Bau, iso/build-docker.sh --release)
      - name: Release-Stand
        id: rel
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          commit="$(gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern release.json --output - | jq -r .commit)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release $RELEASE ohne Commit im Manifest"; exit 1; }
          echo "Release $RELEASE: Commit $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rel.outputs.commit || github.sha }}
      - uses: ./.github/actions/platz
      # Node + Abhängigkeiten auch ohne Neubau: der QEMU-Test braucht Playwright (§7 Schritt 4)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Platz schaffen (GitHub-Runner hat ~14 GB frei, ISO-Bau braucht ~10 GB)
        if: ${{ env.LOKAL != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: KVM
        run: ls -l /dev/kvm && (test -w /dev/kvm || sudo chmod 666 /dev/kvm) && df -h / && free -h
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ inputs.release && !inputs.iso_aus_lauf }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: ISO bauen + Rauchtest (QEMU/UEFI startet bis zum Installer)
        if: ${{ !inputs.iso_aus_lauf }}
        # Eingaben über env statt direkt im Skript (keine Shell-Einschleusung über inputs.version/inputs.release)
        env:
          ISO_VERSION: ${{ inputs.version || format('dev-{0}', github.sha) }}
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
          SCHULOS_REGISTRY_USER: ${{ github.actor }}
          SCHULOS_REGISTRY_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE" ]; then bash iso/build-docker.sh --release "$RELEASE" --out iso/out --rauchtest
          else bash iso/build-docker.sh --version "$ISO_VERSION" --out iso/out --rauchtest; fi
      # GitHub-Runner: gleich hochladen (auch nach fehlgeschlagenen Tests wiederverwendbar); Build-VM: liegen lassen
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.iso_aus_lauf && env.LOKAL != 'true' }}
        with:
          name: schulos-iso
          path: iso/out/
          retention-days: 2
          compression-level: 0
      - name: ISO auf der Build-VM aufheben
        if: ${{ !inputs.iso_aus_lauf && env.LOKAL == 'true' }}
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          mkdir -p "$ISO_LAGER"
          cp iso/out/schulos-*.iso "$ISO_LAGER/letzte.iso"
          cp iso/out/schulos-*.iso.sha256 "$ISO_LAGER/letzte.iso.sha256"
          git rev-parse HEAD > "$ISO_LAGER/letzte.commit"
          # Release-ISO zusätzlich unter ihrer Version (B-49)
          if [ -n "$RELEASE" ]; then cp iso/out/schulos-*.iso iso/out/schulos-*.iso.sha256 iso/out/schulos-*.stueckliste.json "$ISO_LAGER/"; fi
      - name: ISO aus dem Lager (Build-VM)
        if: ${{ inputs.iso_aus_lauf && env.LOKAL == 'true' }}
        run: |
          mkdir -p iso/out && cp "$ISO_LAGER/letzte.iso" iso/out/schulos-letzte.iso
          echo "ISO von Commit $(cat "$ISO_LAGER/letzte.commit")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.iso_aus_lauf && env.LOKAL != 'true' }}
        with:
          name: schulos-iso
          path: iso/out/
          run-id: ${{ inputs.iso_aus_lauf }}
          github-token: ${{ github.token }}
      - name: Platz für die VMs (GitHub-Runner – auf der Build-VM bleiben die Caches)
        if: ${{ !inputs.ohne_qemu && env.LOKAL != 'true' }}
        run: docker system prune -af --volumes >/dev/null && df -h /
      - name: QEMU-Tests (§7)
        if: ${{ !inputs.ohne_qemu && inputs.qemu != 'qcow2' }}
        run: bash scripts/qemu-test.sh iso/out/schulos-*.iso "$RUNNER_TEMP/qemu"
      - name: QEMU-Test qcow2 (B-46)
        if: ${{ !inputs.ohne_qemu && inputs.qemu != 'iso' }}
        run: bash scripts/qemu-test.sh iso/out/schulos-*.iso "$RUNNER_TEMP/qemu-qcow2" --qcow2
      # Abbilder nicht dauerhaft bei GitHub ablegen (B-13) – auf der Build-VM neben der ISO liegen lassen
      - name: Abbilder auf der Build-VM aufheben
        if: ${{ !inputs.ohne_qemu && inputs.qemu != 'iso' && env.LOKAL == 'true' }}
        run: mkdir -p "$ISO_LAGER" && cp "$RUNNER_TEMP"/qemu-qcow2/abbild/*.qcow2* "$ISO_LAGER/" && ls -lh "$ISO_LAGER"
      # B-49/REPO-02: Prüfsumme und Stückliste ans Release; die ISO selbst nur dann als Artefakt, wenn der Anhang auf einem
      # GitHub-Runner entsteht (sonst nimmt ihn der Job auf der Build-VM aus dem Lager – Artefakt-Speicher privater Repos ist knapp)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.release && !inputs.iso_aus_lauf }}
        with:
          name: release-iso-anhang
          path: |
            iso/out/schulos-*.iso.sha256
            iso/out/schulos-*.stueckliste.json
          retention-days: 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.release && !inputs.iso_aus_lauf && env.ANHANG_GITHUB == 'true' }}
        with:
          name: release-iso-datei
          path: iso/out/schulos-*.iso
          retention-days: 1
          compression-level: 0

  # erst nach grünen Tests – eigener Job, nur er darf ins Release schreiben und sieht den Signierschlüssel (REPO-02: ISO +
  # Prüfsumme + cosign-Signatur der Prüfsumme + Stückliste; prüfen: docs/INSTALLATION.md „ISO herunterladen und prüfen“)
  release-anhang:
    needs: iso
    if: ${{ inputs.release && !inputs.iso_aus_lauf && !inputs.reproduzierbar }}
    runs-on: ${{ (inputs.runner == 'github' || vars.SCHULOS_RUNNER == 'oeffentlich' || vars.SCHULOS_RUNNER == 'github') && 'ubuntu-24.04' || fromJSON('["self-hosted","schulos-iso"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # für release/cosign.pub (Gegenprobe der Signatur) und den Platzwächter
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/platz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-iso-anhang
          path: anhang
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.ANHANG_GITHUB == 'true' }}
        with:
          name: release-iso-datei
          path: anhang
      - name: ISO aus dem Lager (Build-VM)
        if: ${{ env.ANHANG_GITHUB != 'true' }}
        run: |
          iso="$(awk '{print $2}' anhang/schulos-*.iso.sha256)"
          [[ "$iso" =~ ^schulos-[0-9A-Za-z.+-]+\.iso$ ]] || { echo "::error::unerwarteter ISO-Name in der Prüfsumme: $iso"; exit 1; }
          cp "$ISO_LAGER/$iso" anhang/
      - name: Prüfsumme der ISO
        run: cd anhang && sha256sum -c ./schulos-*.iso.sha256
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2
      # nur cosign sieht den Schlüssel; Schlüsselpaar wie release.yml (ohne Rekor)
      - name: Prüfsumme signieren
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for f in anhang/schulos-*.iso.sha256; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --use-signing-config=false --output-signature "$f.sig" "$f"
          done
      - name: Signatur prüfen
        run: |
          for f in anhang/schulos-*.iso.sha256; do
            cosign verify-blob --key release/cosign.pub --signature "$f.sig" --insecure-ignore-tlog=true "$f"
          done
          ls -l anhang
      - name: Ans Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" --clobber anhang/*
