# Releases (B-29/B-30, INSTALLATION.md §5a.2, Ablauf in release/README.md).
#  - Tag v<version> bzw. v<version>-rc.N: Release aus diesem Stand mit den Notizen release/notes/<version>.json.
#  - Wöchentlich (Mo 04:00 UTC) bzw. von Hand: neuestes fertiges Release mit aktuellen Fremd-Images (node, restic,
#    caddy, postgres, rest-server) neu bauen; nur wenn sich ein Digest geändert hat → automatisches Patch-Release
#    x.y.(z+1) aus demselben Commit (sicherheitsrelevant, kürzere Beta-Zeit), sonst endet der Lauf nach ~1 min.
# Images App, Backup, Agent → GHCR, mit cosign signiert (Schlüsselpaar aus den Secrets, ohne Rekor); Fremd-Images per
# Digest gepinnt und im Manifest festgehalten; Manifest signiert → GitHub-Release mit release.json + release.json.sig.
# Nur von einem grünen Stand auf main taggen – der Workflow wiederholt die CI nicht (Freikontingent); vor einem getaggten
# Release läuft aber der Update-Test N−1 → N (scripts/update-test.sh).
# Runner (SEC-10/REPO-02): mit SCHULOS_RUNNER=oeffentlich bzw. github auf frischen GitHub-Runnern – der Signierschlüssel
# kommt dann nie auf die Build-VM, auf der auch die CI (Dependabot) läuft; ohne Variable (privates Repo ohne Freiminuten)
# wie bisher auf der Build-VM.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Rechte je Job (zizmor: excessive-permissions) – nur der Release-Job schreibt
permissions:
  contents: read

jobs:
  # B-39: vor einem getaggten Release muss das Update von der vorigen Version klappen (Probelauf, Rückweg)
  update-test:
    if: github.event_name == 'push'
    runs-on: ${{ (vars.SCHULOS_RUNNER == 'github' || vars.SCHULOS_RUNNER == 'oeffentlich') && 'ubuntu-24.04' || fromJSON('["self-hosted","schulos-iso"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/platz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # kein Cache in Release-Läufen (zizmor: cache-poisoning)
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Update-Test N−1 → N
        run: bash scripts/update-test.sh

  release:
    needs: update-test
    # beim wöchentlichen Neubau gibt es keinen Update-Test (gleicher Code, nur neue Fremd-Images)
    if: always() && (needs.update-test.result == 'success' || needs.update-test.result == 'skipped')
    runs-on: ${{ (vars.SCHULOS_RUNNER == 'github' || vars.SCHULOS_RUNNER == 'oeffentlich') && 'ubuntu-24.04' || fromJSON('["self-hosted","schulos-iso"]') }}
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    # SEC-06: Signierschlüssel nur in der Umgebung der beiden Signierschritte (nicht im ganzen Job); tsx aus dem Lockfile
    # (npm ci ohne Install-Skripte) statt `npx -y tsx@4` zur Laufzeit aus dem Netz bzw. dem npx-Cache des Runners
    env:
      GH_TOKEN: ${{ github.token }}
      TSX: node_modules/.bin/tsx
    steps:
      # Werkzeuge (Skripte, cosign.pub) vom ausgelösten Stand; gebaut wird der Build-Stand im Ordner build/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/platz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Werkzeuge mit genau den Versionen aus package-lock.json (Integrität geprüft); keine Install-Skripte von Paketen
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Planen
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            ref="$GITHUB_SHA"
            # self-hosted: .git bleibt zwischen Läufen, checkout löscht nur den Ordner – verwaiste Registrierung entfernen
            git worktree prune && git worktree add --force --detach build "$ref"
            core="${version%%-*}"
            pkg="$(node -p 'require("./build/package.json").version')"
            if [ "$core" != "$pkg" ]; then echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($pkg)"; exit 1; fi
            $TSX scripts/release-manifest.ts --check "$version"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            latest="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | $TSX scripts/release-manifest.ts --latest)"
            if [ -z "$latest" ]; then echo "Noch kein fertiges Release – nichts neu zu bauen"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            gh release download "$latest" --pattern release.json --dir previous
            ref="$(node -p 'require("./previous/release.json").commit')"
            version="$(node -p 'const v=require("./previous/release.json").version.split(".");v[2]=+v[2]+1;v.join(".")')"
            git worktree prune && git worktree add --force --detach build "$ref"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "Neubau von $latest ($ref) als Kandidat v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "$version" != "${version%%-*}" ]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; fi

      - name: Fremd-Images per Digest
        id: upstream
        if: steps.plan.outputs.skip != 'true'
        run: |
          echo "{" > upstream.json; sep=""
          # B-47: getaggtes Release mit den gepinnten Digests (deploy/upstream/Dockerfile, wie die ISO); der wöchentliche
          # Neubau löst die Tags frisch auf (B-30) – Stände ohne Pin-Datei liefern nur Tags
          while IFS='=' read -r name ref; do
            tag="${ref%@*}"
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$ref" != "$tag" ]; then digest="${ref#*@}"
            else digest="$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ && !d {print $2; d=1}')"; fi
            [ -n "$digest" ] || { echo "::error::Kein Digest für $tag"; exit 1; }
            printf '%s  "%s": "%s@%s"' "$sep" "$name" "$tag" "$digest" >> upstream.json; sep=$',\n'
            echo "$name=$tag@$digest" >> "$GITHUB_OUTPUT"
          done < <($TSX scripts/release-manifest.ts --upstream-refs build)
          printf '\n}\n' >> upstream.json
          cat upstream.json
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            changed="$($TSX scripts/release-manifest.ts --changed previous/release.json --upstream upstream.json)"
            if [ -z "$changed" ]; then echo "Fremd-Images unverändert – kein Patch-Release"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Geändert: $changed"
            echo "auto=--auto-patch $changed" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom aus: ein Image-Manifest je Image statt eines Index mit Attestierungen (Digest = genau dieses Image)
      # ohne Build-Cache (B-49): Release-Images hängen nicht vom GitHub-Actions-Cache ab (Cache-Poisoning; Dienst fiel am
      # 2026-10-07 aus und brach v0.1.0-rc.3 ab) – auf der Build-VM dauert der Bau dafür einige Minuten länger
      - name: Image App
        id: app
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          push: true
          provenance: false
          sbom: false
          build-args: |
            SCHULOS_VERSION=${{ steps.plan.outputs.version }}
            NODE_IMAGE=${{ steps.upstream.outputs.node }}
          tags: ${{ steps.plan.outputs.registry }}/schulos:${{ steps.plan.outputs.version }}
      - name: Image Backup
        id: backup
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          file: build/apps/backup/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            SCHULOS_VERSION=${{ steps.plan.outputs.version }}
            NODE_IMAGE=${{ steps.upstream.outputs.node }}
            RESTIC_IMAGE=${{ steps.upstream.outputs.restic }}
            RCLONE_IMAGE=${{ steps.upstream.outputs.rclone }}
          tags: ${{ steps.plan.outputs.registry }}/schulos-backup:${{ steps.plan.outputs.version }}
      - name: Image Agent
        id: agent
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          file: build/apps/agent/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            SCHULOS_VERSION=${{ steps.plan.outputs.version }}
            NODE_IMAGE=${{ steps.upstream.outputs.node }}
            RESTIC_IMAGE=${{ steps.upstream.outputs.restic }}
          tags: ${{ steps.plan.outputs.registry }}/schulos-agent:${{ steps.plan.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        with:
          cosign-release: v3.0.2

      - name: Images signieren
        id: refs
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          r="${{ steps.plan.outputs.registry }}"
          app="$r/schulos@${{ steps.app.outputs.digest }}"
          backup="$r/schulos-backup@${{ steps.backup.outputs.digest }}"
          agent="$r/schulos-agent@${{ steps.agent.outputs.digest }}"
          for ref in "$app" "$backup" "$agent"; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --use-signing-config=false "$ref"
            cosign verify --key release/cosign.pub --insecure-ignore-tlog=true "$ref" > /dev/null
          done
          { echo "app=$app"; echo "backup=$backup"; echo "agent=$agent"; } >> "$GITHUB_OUTPUT"

      # B-48: Inhalt der Images (OS- und npm-Pakete) als CycloneDX je Image – Commit und Digests stehen in release.json.
      # Ohne SBOM (syft gescheitert) geht das Release trotzdem raus, mit Warnung.
      - name: Stückliste der Images (CycloneDX)
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        env:
          APP: ${{ steps.refs.outputs.app }}
          BACKUP: ${{ steps.refs.outputs.backup }}
          AGENT: ${{ steps.refs.outputs.agent }}
        run: |
          mkdir -p dist-release
          for pair in "app=$APP" "backup=$BACKUP" "agent=$AGENT"; do
            name="${pair%%=*}"; ref="${pair#*=}"
            docker run --rm -v "$HOME/.docker/config.json:/config/config.json:ro" -e DOCKER_CONFIG=/config "$(sh scripts/pin.sh syft)" -q \
              "registry:$ref" -o cyclonedx-json > "dist-release/sbom-$name.cdx.json" ||
              { rm -f "dist-release/sbom-$name.cdx.json"; echo "::warning::Keine SBOM für $name ($ref)"; }
          done

      # GATE-031 (C-01): schulosctl und compose.yaml des Build-Stands als Release-Anhang. Ihre SHA-256 stehen im signierten
      # Manifest – `schulosctl update` übernimmt sie nur bei passender Prüfsumme (sich selbst und die Compose-Datei).
      # npm ci im Build-Stand ohne Install-Skripte: gebündelt wird mit dessen eigenem @schulos/server.
      - name: Host-Dateien (schulosctl, compose.yaml)
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir -p dist-release
          (cd build && npm ci --ignore-scripts --no-audit --no-fund && SCHULOS_VERSION="$VERSION" node apps/ctl/build.mjs)
          cp build/apps/ctl/dist/schulosctl.mjs build/compose.yaml dist-release/
          node dist-release/schulosctl.mjs version

      - name: Release-Manifest schreiben
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        run: |
          $TSX scripts/release-manifest.ts --version "${{ steps.plan.outputs.version }}" --commit "${{ steps.plan.outputs.ref }}" \
            --app "${{ steps.refs.outputs.app }}" --backup "${{ steps.refs.outputs.backup }}" --agent "${{ steps.refs.outputs.agent }}" \
            --upstream upstream.json ${{ steps.upstream.outputs.auto }} --files dist-release --out dist-release

      # nur cosign sieht den Schlüssel – kein Node/tsx in diesem Schritt
      - name: Release-Manifest signieren
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --use-signing-config=false \
            --output-signature dist-release/release.json.sig dist-release/release.json

      - name: Release-Manifest prüfen
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        run: |
          $TSX scripts/release-manifest.ts --verify dist-release
          $TSX scripts/release-manifest.ts --hostfiles dist-release
          cat dist-release/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub-Release anlegen
        if: steps.plan.outputs.skip != 'true' && steps.upstream.outputs.skip != 'true'
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" --target "${{ steps.plan.outputs.ref }}" ${{ steps.plan.outputs.prerelease }} \
            --title "SchulOS ${{ steps.plan.outputs.version }}" --notes-file dist-release/release-notes.md \
            dist-release/release.json dist-release/release.json.sig dist-release/schulosctl.mjs dist-release/compose.yaml \
            $(ls dist-release/sbom-*.cdx.json 2>/dev/null)
