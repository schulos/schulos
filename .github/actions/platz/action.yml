# Platzwächter (scripts/ci/platz.sh) – nur auf der Build-VM (self-hosted), auf GitHub-Runnern ohne Wirkung.
# In jedem Job, der auf der Build-VM laufen kann, direkt nach dem Checkout aufrufen: `- uses: ./.github/actions/platz`
# Jobs mit großem Eigenbedarf (ISO + QEMU + qcow2 ~30 GB) setzen höhere Schwellen über die Eingaben.
name: Platz auf der Build-VM
description: Räumt Docker-Reste auf und bricht ab, wenn zu wenig Platz frei ist
inputs:
  aufraeumen_gb:
    description: Unter so viel GB frei gründlich aufräumen
    required: false
    default: "30"
  mindest_gb:
    description: Unter so viel GB frei (nach dem Aufräumen) bricht der Job ab
    required: false
    default: "15"
runs:
  using: composite
  steps:
    - name: Platz prüfen und aufräumen
      if: ${{ runner.environment == 'self-hosted' }}
      shell: bash
      env:
        PLATZ_AUFRAEUMEN_GB: ${{ inputs.aufraeumen_gb }}
        PLATZ_MINDEST_GB: ${{ inputs.mindest_gb }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/ci/platz.sh"
